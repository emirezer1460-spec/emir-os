<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EMIR OS</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#16253d">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f5f2eb;
      color: #1c212a;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .wrapper {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    header {
      background: #16253d;
      color: #ffffff;
      padding: 16px 20px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo-badge {
      width: 40px;
      height: 40px;
      background: #0f1a2b;
      color: #b38f4d;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      font-weight: bold;
      font-size: 20px;
      border: 1px solid #b38f4d;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1.4fr;
      gap: 16px;
    }
    @media (max-width: 800px) {
      .grid { grid-template-columns: 1fr; }
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2ddd3;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: #16253d;
      margin-bottom: 12px;
      border-bottom: 1px solid #f0eae1;
      padding-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }
    input[type="text"], textarea {
      width: 100%;
      border: 1px solid #e2ddd3;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 14px;
      background: #faf8f5;
      outline: none;
      font-family: inherit;
    }
    textarea { resize: vertical; margin-top: 6px; }
    .btn {
      background: #16253d;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-light {
      background: #eee8dc;
      color: #16253d;
      border: 1px solid #ded6c5;
    }
    .todo-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      background: #faf8f5;
      border-radius: 6px;
      margin-top: 6px;
    }
    .todo-item.done span { text-decoration: line-through; color: #888; }
    .vocab-chip {
      background: #f7f1e5;
      border: 1px solid #e8deb8;
      color: #7a5a1f;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
      display: inline-flex;
      gap: 6px;
      margin: 4px;
    }
    .wb-box {
      border: 1px solid #e2ddd3;
      border-radius: 8px;
      background: #ffffff;
      height: 350px;
      position: relative;
      touch-action: none;
    }
    canvas { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <div class="wrapper">
    <header>
      <div style="display:flex; align-items:center; gap:12px;">
        <div class="logo-badge">E</div>
        <div>
          <h1 style="font-size:20px;">EMIR OS</h1>
          <p style="font-size:12px; color:#cbd5e1;">Kişisel Yaşam & Çalışma Alanı</p>
        </div>
      </div>
      <div style="text-align:right;">
        <div id="liveDate" style="font-weight:600; color:#f7f1e5; font-size:14px;"></div>
        <div id="liveClock" style="font-size:12px; opacity:0.8;"></div>
      </div>
    </header>

    <div class="grid">
      <!-- SOL TARAF -->
      <div>
        <div class="card">
          <div class="card-title"><span>Bugünün Hedefleri</span></div>
          <div style="display:flex; gap:6px;">
            <input type="text" id="newTodoInput" placeholder="Görev ekle...">
            <button class="btn" onclick="addTodo()">Ekle</button>
          </div>
          <div id="todoList" style="margin-top:8px;"></div>
        </div>

        <div class="card">
          <div class="card-title"><span>Kelime Defteri (EN / ES)</span></div>
          <div style="display:flex; gap:6px;">
            <input type="text" id="vocabWord" placeholder="Kelime...">
            <input type="text" id="vocabMeaning" placeholder="Anlamı...">
            <button class="btn" onclick="addVocab()">Ekle</button>
          </div>
          <div id="vocabContainer" style="margin-top:8px;"></div>
        </div>
      </div>

      <!-- SAĞ TARAF -->
      <div>
        <div class="card">
          <div class="card-title">
            <span>Hızlı Not</span>
            <span id="saveStatus" style="font-size:12px; font-weight:normal; color:#888;">Otomatik kaydeder</span>
          </div>
          <input type="text" id="noteTitle" placeholder="Başlık...">
          <textarea id="noteContent" rows="4" placeholder="Notunu yaz..."></textarea>
          <div style="display:flex; justify-content:flex-end; gap:6px; margin-top:8px;">
            <button class="btn btn-light" onclick="newNote()">Temizle</button>
            <button class="btn" onclick="saveCurrentNote()">Kaydet</button>
          </div>
          <div id="notesList" style="margin-top:10px;"></div>
        </div>

        <div class="card">
          <div class="card-title">
            <span>Çizim Tahtası (Stylus / Kalem)</span>
            <div>
              <button class="btn btn-light" style="padding:2px 8px; font-size:11px;" onclick="clearCanvas()">Temizle</button>
              <button class="btn" style="padding:2px 8px; font-size:11px;" onclick="downloadDrawing()">İndir</button>
            </div>
          </div>
          <div class="wb-box">
            <canvas id="mainCanvas"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      document.getElementById('liveDate').textContent = now.toLocaleDateString('tr-TR', { weekday: 'long', day: 'numeric', month: 'long' });
      document.getElementById('liveClock').textContent = now.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // TO-DO
    let todos = JSON.parse(localStorage.getItem('emir_os_todos') || '[]');
    function renderTodos() {
      const el = document.getElementById('todoList');
      el.innerHTML = '';
      todos.forEach((t, i) => {
        const item = document.createElement('div');
        item.className = 'todo-item' + (t.done ? ' done' : '');
        item.innerHTML = `
          <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTodo(${i})">
          <span style="flex:1;">${t.text}</span>
          <button style="border:none; background:none; color:#c2413a; cursor:pointer;" onclick="deleteTodo(${i})">✕</button>
        `;
        el.appendChild(item);
      });
      localStorage.setItem('emir_os_todos', JSON.stringify(todos));
    }
    function addTodo() {
      const inp = document.getElementById('newTodoInput');
      if (!inp.value.trim()) return;
      todos.push({ text: inp.value.trim(), done: false });
      inp.value = '';
      renderTodos();
    }
    function toggleTodo(i) { todos[i].done = !todos[i].done; renderTodos(); }
    function deleteTodo(i) { todos.splice(i, 1); renderTodos(); }

    // VOCAB
    let vocabs = JSON.parse(localStorage.getItem('emir_os_vocabs') || '[]');
    function renderVocabs() {
      const el = document.getElementById('vocabContainer');
      el.innerHTML = '';
      vocabs.forEach((v, i) => {
        const chip = document.createElement('div');
        chip.className = 'vocab-chip';
        chip.innerHTML = `<strong>${v.word}</strong>: <span>${v.meaning}</span> <span style="cursor:pointer;" onclick="deleteVocab(${i})">✕</span>`;
        el.appendChild(chip);
      });
      localStorage.setItem('emir_os_vocabs', JSON.stringify(vocabs));
    }
    function addVocab() {
      const w = document.getElementById('vocabWord');
      const m = document.getElementById('vocabMeaning');
      if (!w.value.trim()) return;
      vocabs.unshift({ word: w.value.trim(), meaning: m.value.trim() });
      w.value = ''; m.value = '';
      renderVocabs();
    }
    function deleteVocab(i) { vocabs.splice(i, 1); renderVocabs(); }

    // NOTLAR
    let notes = JSON.parse(localStorage.getItem('emir_os_notes') || '[]');
    let currentNoteId = null;
    const titleEl = document.getElementById('noteTitle');
    const contentEl = document.getElementById('noteContent');
    const statusEl = document.getElementById('saveStatus');

    function renderNotes() {
      const listEl = document.getElementById('notesList');
      listEl.innerHTML = '';
      notes.slice(0, 5).forEach(n => {
        const div = document.createElement('div');
        div.style = 'padding:6px; background:#faf8f5; border-radius:6px; margin-top:4px; display:flex; justify-content:space-between; align-items:center; cursor:pointer;';
        div.innerHTML = `<span onclick="loadNote('${n.id}')" style="font-size:13px; font-weight:600; color:#16253d;">${n.title || 'Başlıksız'}</span><button onclick="deleteNote('${n.id}')" style="border:none; background:none; color:#c2413a; cursor:pointer;">✕</button>`;
        listEl.appendChild(div);
      });
    }
    function saveCurrentNote() {
      const t = titleEl.value.trim();
      const c = contentEl.value.trim();
      if (!t && !c) return;
      if (!currentNoteId) {
        currentNoteId = Date.now().toString();
        notes.unshift({ id: currentNoteId, title: t, content: c, updatedAt: Date.now() });
      } else {
        const n = notes.find(x => x.id === currentNoteId);
        if (n) { n.title = t; n.content = c; n.updatedAt = Date.now(); }
      }
      localStorage.setItem('emir_os_notes', JSON.stringify(notes));
      statusEl.textContent = 'Kaydedildi';
      renderNotes();
    }
    function newNote() {
      currentNoteId = null;
      titleEl.value = ''; contentEl.value = '';
      statusEl.textContent = 'Yeni not';
    }
    function loadNote(id) {
      const n = notes.find(x => x.id === id);
      if (!n) return;
      currentNoteId = n.id;
      titleEl.value = n.title; contentEl.value = n.content;
      statusEl.textContent = 'Yüklendi';
    }
    function deleteNote(id) {
      notes = notes.filter(x => x.id !== id);
      localStorage.setItem('emir_os_notes', JSON.stringify(notes));
      if (currentNoteId === id) newNote();
      renderNotes();
    }

    // CANVAS
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    window.addEventListener('load', resizeCanvas);
    window.addEventListener('resize', resizeCanvas);

    function getPos(e) {
      const r = canvas.getBoundingClientRect();
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: cx - r.left, y: cy - r.top };
    }
    function start(e) { isDrawing = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); }
    function move(e) {
      if (!isDrawing) return;
      e.preventDefault();
      const p = getPos(e);
      ctx.lineTo(p.x, p.y);
      ctx.strokeStyle = '#16253d';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.stroke();
    }
    function end() { isDrawing = false; }

    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    window.addEventListener('mouseup', end);
    canvas.addEventListener('touchstart', start, { passive: false });
    canvas.addEventListener('touchmove', move, { passive: false });
    window.addEventListener('touchend', end);

    function clearCanvas() {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    function downloadDrawing() {
      const a = document.createElement('a');
      a.download = 'cizim.png';
      a.href = canvas.toDataURL();
      a.click();
    }

    renderTodos();
    renderVocabs();
    renderNotes();
  </script>
</body>
</html>
