<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EMIR OS</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#16253d">
  <style>
    :root {
      --bg: #f5f2eb;
      --card-bg: #ffffff;
      --navy: #16253d;
      --navy-light: #223755;
      --gold: #b38f4d;
      --gold-light: #f7f1e5;
      --border: #e2ddd3;
      --text-main: #1c212a;
      --text-muted: #64748b;
      --accent-red: #c2413a;
      --accent-green: #2e7d5b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      padding: 18px;
      display: flex;
      justify-content: center;
    }
    .wrapper {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* HEADER */
    header {
      background: var(--navy);
      color: #fff;
      padding: 16px 20px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 12px rgba(22, 37, 61, 0.12);
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .logo-badge {
      width: 44px;
      height: 44px;
      background: #0f1a2b;
      color: var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      font-weight: 800;
      font-size: 22px;
      border: 1px solid var(--gold);
    }
    .header-title h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.6px;
    }
    .header-title p {
      font-size: 13px;
      color: #cbd5e1;
    }
    .header-right {
      text-align: right;
      font-size: 13px;
      color: #e2e8f0;
    }
    .header-date {
      font-weight: 600;
      color: var(--gold-light);
    }

    /* DASHBOARD GRID */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1.2fr 1.8fr;
      gap: 18px;
    }
