<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>EMIR OS</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#132136">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #f5f1e8;
      --card: #ffffff;
      --navy: #132136;
      --navy-light: #213554;
      --gold: #c59b4c;
      --border: #e2dbcd;
      --text: #1a202c;
      --muted: #64748b;
      --shadow-app: 0 16px 36px rgba(19, 33, 54, 0.16);
      --yellow-hl: rgba(255, 225, 53, 0.45);
      --blue-hl: rgba(56, 148, 255, 0.40);
      --red-hl: rgba(255, 71, 87, 0.40);
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .os-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ÜST BAR */
    .os-topbar {
      height: 68px;
      background: var(--navy);
      color: #fff;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 50;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      position: relative;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .center-logo-wrap {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }
    .eo-circle-logo {
      width: 44px;
      height: 44px;
      background: radial-gradient(circle, #213554 0%, #0a1322 100%);
      border: 2px solid var(--gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(197, 155, 76, 0.35);
    }
    .eo-svg { width: 26px; height: 26px; }
    .os-title-text {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #fbf7ee;
    }

    /* 1. ANA EKRAN */
    #home-launcher {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 32px;
      width: 100%;
      height: calc(100vh - 68px);
    }
    .tri-app-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
      width: 100%;
      max-width: 1200px;
      height: 72vh;
      align-items: stretch;
    }
    @media (max-width: 850px) {
      .tri-app-grid { grid-template-columns: 1fr; height: auto; overflow-y: auto; }
    }
    .giant-app-card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      cursor: pointer;
      box-shadow: var(--shadow-app);
      transition: transform 0.15s ease, border-color 0.15s ease;
      position: relative;
      overflow: hidden;
      user-select: none;
    }
    .giant-app-card:active { transform: scale(0.95); border-color: var(--gold); }
    .giant-app-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; height: 8px;
      background: var(--gold);
    }
    .giant-icon-bubble {
      width: 130px;
      height: 130px;
      border-radius: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.08);
      border: 3px solid rgba(255,255,255,0.9);
      pointer-events: none;
    }
    .giant-label-text {
      font-size: 24px;
      font-weight: 800;
      color: var(--navy);
      letter-spacing: 0.5px;
      pointer-events: none;
    }

    /* 2. TAM EKRAN MODÜLLER */
    .fullscreen-app-view {
      position: absolute;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: var(--bg);
      display: none;
      flex-direction: column;
      z-index: 100;
      overflow: hidden;
    }
    .fullscreen-app-view.active { display: flex !important; }

    .app-topbar {
      height: 64px;
      padding: 0 24px;
      background: var(--navy);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    }
    .home-circle-btn {
      width: 44px;
      height: 44px;
      background: radial-gradient(circle, #213554 0%, #0e1929 100%);
      border: 1.5px solid var(--gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: transform 0.15s ease;
    }
    .home-circle-btn:active { transform: scale(0.9); }
    .home-circle-btn svg { width: 22px; height: 22px; }

    /* KÜTÜPHANE GEZGİNİ */
    .lib-browser-stage {
      flex: 1;
      padding: 28px 36px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .lib-breadcrumb-bar {
      font-size: 16px;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .folder-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 20px;
    }
    .big-folder-card {
      background: #ffffff;
      border: 2px solid var(--border);
      border-radius: 24px;
      padding: 22px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,0.05);
      transition: transform 0.15s ease, border-color 0.15s ease;
      user-select: none;
      position: relative;
    }
    .big-folder-card:active { transform: scale(0.94); border-color: var(--gold); }
    .big-folder-icon { font-size: 52px; pointer-events: none; }
    .big-folder-name { font-size: 15px; font-weight: 800; color: var(--navy); text-align: center; pointer-events: none; }

    /* DİNAMİK RENKLİ OKUNMA BARI */
    .reading-progress-wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-top: 6px;
      pointer-events: none;
    }
    .reading-progress-bar-bg {
      width: 100%;
      height: 8px;
      background: #e2dbcd;
      border-radius: 6px;
      overflow: hidden;
    }
    .reading-progress-bar-fill {
      height: 100%;
      border-radius: 6px;
      transition: width 0.3s ease, background-color 0.3s ease;
    }
    .reading-progress-text {
      font-size: 12px;
      font-weight: 800;
      text-align: right;
      transition: color 0.3s ease;
    }

    .fab-add-btn {
      position: absolute;
      bottom: 32px;
      right: 32px;
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: var(--gold);
      color: #fff;
      font-size: 38px;
      font-weight: 300;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(197, 155, 76, 0.45);
      cursor: pointer;
      z-index: 40;
    }
    .fab-add-btn:active { transform: scale(0.9); }
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: #fff;
      border-radius: 24px;
      padding: 28px;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 20px 45px rgba(0,0,0,0.25);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* NOTLAR DEFTERİ */
    .notes-book-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      gap: 20px;
      overflow: hidden;
    }
    .notebook-paper-page {
      width: 90%;
      max-width: 880px;
      height: 80vh;
      background: #fbf9f4;
      background-image: linear-gradient(#e6dfd1 1px, transparent 1px);
      background-size: 100% 32px;
      line-height: 32px;
      border: 3px solid var(--border);
      border-radius: 24px;
      padding: 36px 44px;
      box-shadow: 0 16px 40px rgba(19, 33, 54, 0.12);
      font-family: "Georgia", serif;
      overflow-y: auto;
    }
    .page-arrow-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--navy);
      color: #fff;
      border: none;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-app);
      flex-shrink: 0;
    }
    .page-arrow-btn:active { transform: scale(0.9); }

    /* KİŞİSEL DEFTER */
    .personal-notebook-shell {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 14px 20px;
      gap: 10px;
    }
    .notes-toolbar {
      height: 58px;
      background: #ffffff;
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-shrink: 0;
    }
    .palette-circle {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      border: 3px solid transparent;
      transition: transform 0.12s ease;
    }
    .palette-circle.active { border-color: var(--navy); transform: scale(1.2); }
    .size-slider-box {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      color: var(--navy);
    }
    .size-slider-box input[type="range"] {
      width: 90px;
      cursor: pointer;
    }
    .brush-size-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--navy);
      display: inline-block;
      transition: all 0.1s ease;
    }
    .personal-sheet-pad {
      flex: 1;
      background: #ffffff;
      background-image: linear-gradient(#f0ece1 1px, transparent 1px);
      background-size: 100% 30px;
      border: 2px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      position: relative;
      overflow: hidden;
      touch-action: none !important;
    }
    #personalCanvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none !important;
      cursor: crosshair;
    }

    /* PDF OKUMA EKRANI & EDGE/ADOBE TARZI AKILLI HIGHLIGHT MOTORU */
    .pdf-reader-fullscreen {
      position: absolute;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #3e444c;
      display: none;
      flex-direction: column;
      z-index: 120;
    }
    .pdf-reader-fullscreen.active { display: flex; }
    .reader-topbar {
      height: 64px;
      background: #18202c;
      color: #fff;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
    }
    .reader-stage-wrap {
      flex: 1;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px;
      position: relative;
      user-select: none;
    }
    .pdf-page-box {
      position: relative;
      background: #fff;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    }
    #pdfRenderCanvas { display: block; }
    #pdfDrawCanvas {
      position: absolute;
      top: 0; left: 0;
      mix-blend-mode: multiply;
      pointer-events: none;
    }
    #pdfDrawCanvas.drawing-enabled {
      pointer-events: auto !important;
      touch-action: none !important;
      cursor: crosshair;
    }

    .page-scrubber-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.08);
      padding: 4px 12px;
      border-radius: 12px;
    }
    .page-scrubber-box input[type="range"] {
      width: 110px;
      accent-color: var(--gold);
      cursor: pointer;
    }

    .toggle-hl-btn {
      background: #2d3748;
      color: #cbd5e1;
      border: 1.5px solid #4a5568;
      padding: 7px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .toggle-hl-btn.active {
      background: var(--gold);
      color: #fff;
      border-color: #fff;
      box-shadow: 0 0 12px rgba(197, 155, 76, 0.6);
    }

    .color-legend-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 8px;
      background: rgba(255,255,255,0.12);
      cursor: pointer;
      user-select: none;
    }
    .color-legend-badge.active { outline: 2px solid #fff; }

    .btn {
      background: var(--navy);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-gold { background: var(--gold); color: #fff; }
    .btn-light { background: #ece6d8; color: var(--navy); }
  </style>

  <script>
    function launchApp(appId) {
      document.querySelectorAll('.fullscreen-app-view').forEach(function(el) {
        el.classList.remove('active');
      });
      var target = document.getElementById(appId);
      if (target) {
        target.classList.add('active');
      }
      if (appId === 'app-personal') {
        setTimeout(initPersonalCanvas, 50);
      }
      if (appId === 'app-library') {
        renderBrowserView();
      }
      if (appId === 'app-notes') {
        renderNotesPage();
      }
    }

    function returnToHome() {
      document.querySelectorAll('.fullscreen-app-view').forEach(function(el) {
        el.classList.remove('active');
      });
      document.getElementById('pdfReaderModal').classList.remove('active');
    }
  </script>
</head>
<body>
  <div class="os-container">
    <!-- ÜST BAR -->
    <div class="os-topbar">
      <div class="topbar-left">
        <div id="liveDate" style="font-weight:700; font-size:14px; color:#fbf7ee;">Bugün</div>
      </div>

      <!-- ORTADA EO DÜĞME LOGOSU -->
      <div class="center-logo-wrap" onclick="returnToHome()">
        <div class="eo-circle-logo">
          <svg class="eo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M22 24H50M22 50H44M22 76H50M22 24V76" stroke="#c59b4c" stroke-width="8.5" stroke-linecap="round"/>
            <circle cx="64" cy="50" r="24" stroke="#ffffff" stroke-width="8.5"/>
          </svg>
        </div>
        <span class="os-title-text">EMIR OS</span>
      </div>

      <div id="liveClock" style="font-size:13px; font-weight:600; opacity:0.85;">--:--</div>
    </div>

    <!-- 1. ANA EKRAN (3 DEV KART) -->
    <div id="home-launcher">
      <div class="tri-app-grid">
        <div class="giant-app-card" onclick="launchApp('app-library')">
          <div class="giant-icon-bubble" style="background:#fdf8eb; color:#876719;">📚</div>
          <div class="giant-label-text">Kütüphane</div>
        </div>

        <div class="giant-app-card" onclick="launchApp('app-notes')">
          <div class="giant-icon-bubble" style="background:#fff3eb; color:#b25e1a;">📖</div>
          <div class="giant-label-text">Notlar</div>
        </div>

        <div class="giant-app-card" onclick="launchApp('app-personal')">
          <div class="giant-icon-bubble" style="background:#edf3fc; color:#1b4d89;">✍️</div>
          <div class="giant-label-text">Kişisel Defter</div>
        </div>
      </div>
    </div>

    <!-- A. KÜTÜPHANE -->
    <div id="app-library" class="fullscreen-app-view">
      <div class="app-topbar">
        <div class="home-circle-btn" onclick="returnToHome()" title="Ana Ekrana Dön">
          <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M22 24H50M22 50H44M22 76H50M22 24V76" stroke="#c59b4c" stroke-width="8.5" stroke-linecap="round"/>
            <circle cx="64" cy="50" r="24" stroke="#ffffff" stroke-width="8.5"/>
          </svg>
        </div>
        <strong id="libCurrentBreadcrumb" style="font-size:18px; color:#fbf7ee;">Kütüphane</strong>
        <div style="width:44px;"></div>
      </div>

      <div class="lib-browser-stage">
        <div class="lib-breadcrumb-bar" id="libBreadcrumbNav"></div>
        <div class="folder-grid" id="folderGridContainer"></div>
        <button class="fab-add-btn" onclick="openAddMenuModal()">+</button>
      </div>
    </div>

    <!-- (+) MODALI -->
    <div class="modal-overlay" id="addMenuModal">
      <div class="modal-box">
        <h3 style="color:var(--navy); font-size:18px;">İçerik Ekle</h3>
        <p style="font-size:13px; color:var(--muted);">Bu klasör içine ne eklemek istersiniz?</p>
        <button class="btn btn-gold" style="padding:14px;" onclick="triggerPdfUpload()">📄 PDF Dosyası Yükle</button>
        <button class="btn btn-light" style="padding:14px;" onclick="promptNewFolder()">📁 Yeni Klasör Oluştur</button>
        <button class="btn" style="background:#ddd; color:#333;" onclick="closeAddMenuModal()">İptal</button>
      </div>
    </div>
    <input type="file" id="hiddenPdfPicker" accept="application/pdf" style="display:none;" onchange="handlePdfSelected(event)">

    <!-- PDF OKUYUCU (ADOBE/EDGE TARZI SNAP HIGHLIGHTER) -->
    <div class="pdf-reader-fullscreen" id="pdfReaderModal">
      <div class="reader-topbar">
        <div class="home-circle-btn" onclick="closePdfReader()" title="Kütüphaneye Dön">
          <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M22 24H50M22 50H44M22 76H50M22 24V76" stroke="#c59b4c" stroke-width="8.5" stroke-linecap="round"/>
            <circle cx="64" cy="50" r="24" stroke="#ffffff" stroke-width="8.5"/>
          </svg>
        </div>

        <button class="toggle-hl-btn active" id="hlToggleBtn" onclick="toggleHighlighterMode()">
          <span>🖍️ Vurgulayıcı: AÇIK</span>
        </button>

        <div style="display:flex; align-items:center; gap:6px;">
          <div class="color-legend-badge active" id="badgeYellow" onclick="setPdfColor('yellow')">
            <div style="width:14px; height:14px; border-radius:50%; background:#f59e0b;"></div>
            <span>Sarı</span>
          </div>
          <div class="color-legend-badge" id="badgeBlue" onclick="setPdfColor('blue')">
            <div style="width:14px; height:14px; border-radius:50%; background:#2563eb;"></div>
            <span>Mavi</span>
          </div>
          <div class="color-legend-badge" id="badgeRed" onclick="setPdfColor('red')">
            <div style="width:14px; height:14px; border-radius:50%; background:#dc2626;"></div>
            <span>Kırmızı</span>
          </div>
          <button class="btn btn-light" style="padding:6px 10px; font-size:12px;" onclick="setPdfEraser()">Silgi</button>
        </div>

        <div class="page-scrubber-box">
          <button class="btn btn-light" style="padding:4px 8px; font-size:12px;" onclick="pdfPrevPage()">◀</button>
          <input type="range" id="pageScrubberSlider" min="1" max="1" value="1" oninput="onScrubberSlide(this.value)">
          <span id="pdfPageInfo" style="font-size:12px; font-weight:800; min-width:65px; text-align:center;">1 / 1</span>
          <button class="btn btn-light" style="padding:4px 8px; font-size:12px;" onclick="pdfNextPage()">▶</button>
        </div>
      </div>

      <div class="reader-stage-wrap" id="readerTouchStage">
        <div class="pdf-page-box" id="pdfPageBox">
          <canvas id="pdfRenderCanvas"></canvas>
          <canvas id="pdfDrawCanvas" class="drawing-enabled"></canvas>
        </div>
      </div>
    </div>

    <!-- B. NOTLAR -->
    <div id="app-notes" class="fullscreen-app-view">
      <div class="app-topbar">
        <div class="home-circle-btn" onclick="returnToHome()" title="Ana Ekrana Dön">
          <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M22 24H50M22 50H44M22 76H50M22 24V76" stroke="#c59b4c" stroke-width="8.5" stroke-linecap="round"/>
            <circle cx="64" cy="50" r="24" stroke="#ffffff" stroke-width="8.5"/>
          </svg>
        </div>
        <strong style="font-size:18px; color:#fbf7ee;">📖 Notlar (Otomatik Ders & Okuma Sentezleri)</strong>
        <span id="notesPageIndex" style="font-size:13px; color:#cbd5e1; font-weight:700;">Sayfa: 0 / 0</span>
      </div>
      <div class="notes-book-stage">
        <button class="page-arrow-btn" onclick="prevNotesPage()">◀</button>
        <div class="notebook-paper-page">
          <div id="notesPageContent"></div>
        </div>
        <button class="page-arrow-btn" onclick="nextNotesPage()">▶</button>
      </div>
    </div>

    <!-- C. KİŞİSEL DEFTER -->
    <div id="app-personal" class="fullscreen-app-view">
      <div class="app-topbar">
        <div class="home-circle-btn" onclick="returnToHome()" title="Ana Ekrana Dön">
          <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M22 24H50M22 50H44M22 76H50M22 24V76" stroke="#c59b4c" stroke-width="8.5" stroke-linecap="round"/>
            <circle cx="64" cy="50" r="24" stroke="#ffffff" stroke-width="8.5"/>
          </svg>
        </div>
        <div style="display:flex; align-items:center; gap:12px;">
          <strong style="font-size:18px; color:#fbf7ee;">✍️ Kişisel Defter</strong>
          <span id="personalSheetIndex" style="font-size:13px; background:#213554; padding:4px 10px; border-radius:6px; color:#fff; font-weight:700;">Sayfa: 1 / 1</span>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-light" style="padding:6px 12px;" onclick="prevPersonalSheet()">◀</button>
          <button class="btn btn-light" style="padding:6px 12px;" onclick="nextPersonalSheet()">▶</button>
          <button class="btn btn-gold" style="padding:6px 12px;" onclick="addPersonalSheet()">+ Yeni Sayfa</button>
          <button class="btn btn-light" style="padding:6px 10px;" onclick="clearPersonalPad()">Sil</button>
        </div>
      </div>

      <div class="personal-notebook-shell">
        <div class="notes-toolbar">
          <div style="display:flex; align-items:center; gap:10px;">
            <span style="font-size:13px; font-weight:700; color:var(--navy);">Renk:</span>
            <div class="palette-circle active" style="background:#132136;" onclick="selectPenColor('#132136', this)"></div>
            <div class="palette-circle" style="background:#2563eb;" onclick="selectPenColor('#2563eb', this)"></div>
            <div class="palette-circle" style="background:#dc2626;" onclick="selectPenColor('#dc2626', this)"></div>
            <div class="palette-circle" style="background:#c59b4c;" onclick="selectPenColor('#c59b4c', this)"></div>
            <div class="palette-circle" style="background:rgba(245, 158, 11, 0.45); border:1px solid #e0a324;" title="Fosforlu Sarı" onclick="selectPenColor('rgba(245, 158, 11, 0.45)', this)"></div>
            <button class="btn btn-light" id="eraserToggleBtn" style="padding:6px 14px; font-size:13px; margin-left:6px;" onclick="toggleEraser(this)">🧹 Silgi</button>
          </div>

          <div class="size-slider-box">
            <span id="brushSizeLabel">Kalınlık: 3px</span>
            <input type="range" id="sizeRangeInput" min="1" max="45" value="3" oninput="onBrushSizeChange(this.value)">
            <span class="brush-size-dot" id="sizePreviewDot"></span>
          </div>
        </div>

        <div class="personal-sheet-pad" id="personalPadWrap">
          <canvas id="personalCanvas"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <script>
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    function tick() {
      const n = new Date();
      document.getElementById('liveDate').textContent = n.toLocaleDateString('tr-TR', { weekday: 'long', day: 'numeric', month: 'long' });
      document.getElementById('liveClock').textContent = n.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(tick, 1000); tick();

    // ==========================================
    // KÜTÜPHANE GEZGİNİ
    // ==========================================
    const DEFAULT_FOLDERS = [
      { id: 'f_articles', parent: 'root', name: 'Makaleler', isArticleFolder: true },
      { id: 'f_books', parent: 'root', name: 'Kitaplar', isArticleFolder: false },
      { id: 'f_coursebooks', parent: 'f_books', name: 'Ders Kitapları', isArticleFolder: false },
      { id: 'f_serkan', parent: 'f_coursebooks', name: 'Serkan Hoca', isArticleFolder: false },
      { id: 'f_serkan_art', parent: 'f_serkan', name: 'Makaleler', isArticleFolder: true },
      { id: 'f_dogan', parent: 'f_coursebooks', name: 'Doğan Hoca', isArticleFolder: false },
      { id: 'f_dogan_art', parent: 'f_dogan', name: 'Makaleler', isArticleFolder: true },
      { id: 'f_banu', parent: 'f_coursebooks', name: 'Banu Hoca', isArticleFolder: false },
      { id: 'f_banu_art', parent: 'f_banu', name: 'Makaleler', isArticleFolder: true },
      { id: 'f_mehmet', parent: 'f_coursebooks', name: 'Mehmet Hoca', isArticleFolder: false },
      { id: 'f_mehmet_art', parent: 'f_mehmet', name: 'Makaleler', isArticleFolder: true }
    ];

    let currentFolderId = 'root';
    let storedFolders = JSON.parse(localStorage.getItem('emir_os_folders') || 'null');
    if (!storedFolders || !Array.isArray(storedFolders) || storedFolders.length === 0) {
      storedFolders = DEFAULT_FOLDERS;
      localStorage.setItem('emir_os_folders', JSON.stringify(storedFolders));
    }
    let storedFiles = JSON.parse(localStorage.getItem('emir_os_files') || '[]');

    function isFolderArticle(folderId) {
      const f = storedFolders.find(x => x.id === folderId);
      return f ? (f.isArticleFolder || f.name.toLowerCase().includes('makale')) : false;
    }

    // Dinamik Renk Fonksiyonu: 0% yeşil -> 50% turuncu/sarı -> 100% koyu kırmızı
    function getProgressColor(percent) {
      if (percent < 35) return '#207849'; // Yeşil
      if (percent < 70) return '#d97706'; // Turuncu / Amber
      return '#dc2626'; // Kırmızı
    }

    function renderBrowserView() {
      const grid = document.getElementById('folderGridContainer');
      const breadcrumb = document.getElementById('libBreadcrumbNav');
      grid.innerHTML = '';
      breadcrumb.innerHTML = '';

      const path = [];
      let temp = currentFolderId;
      while (temp !== 'root') {
        const found = storedFolders.find(x => x.id === temp);
        if (found) { path.unshift(found); temp = found.parent; } else break;
      }

      const rootSpan = document.createElement('span');
      rootSpan.textContent = 'Kütüphane';
      rootSpan.style.cursor = 'pointer';
      rootSpan.onclick = () => { currentFolderId = 'root'; renderBrowserView(); };
      breadcrumb.appendChild(rootSpan);

      path.forEach(p => {
        const arrow = document.createElement('span'); arrow.textContent = ' ➔ '; arrow.style.color = '#888';
        const span = document.createElement('span'); span.textContent = p.name; span.style.cursor = 'pointer';
        span.onclick = () => { currentFolderId = p.id; renderBrowserView(); };
        breadcrumb.appendChild(arrow);
        breadcrumb.appendChild(span);
      });

      const subFolders = storedFolders.filter(x => x.parent === currentFolderId);
      subFolders.forEach(sf => {
        const card = document.createElement('div');
        card.className = 'big-folder-card';
        card.innerHTML = `<div class="big-folder-icon">📁</div><div class="big-folder-name">${sf.name}</div>`;
        card.onclick = () => { currentFolderId = sf.id; renderBrowserView(); };
        grid.appendChild(card);
      });

      let files = [];
      if (currentFolderId === 'f_articles') {
        files = storedFiles.filter(file => isFolderArticle(file.folderId));
      } else {
        files = storedFiles.filter(file => file.folderId === currentFolderId);
      }

      files.forEach(file => {
        const card = document.createElement('div');
        card.className = 'big-folder-card';
        const progress = file.progress || 0;
        const color = getProgressColor(progress);

        const progressBarHtml = `
          <div class="reading-progress-wrap">
            <div class="reading-progress-bar-bg">
              <div class="reading-progress-bar-fill" style="width: ${progress}%; background-color: ${color};"></div>
            </div>
            <div class="reading-progress-text" style="color: ${color};">%${progress} okundu</div>
          </div>
        `;

        card.innerHTML = `
          <div class="big-folder-icon">📄</div>
          <div class="big-folder-name">${file.title}</div>
          ${progressBarHtml}
          <button style="border:none; background:none; color:#dc2626; font-size:12px; margin-top:6px; cursor:pointer;" onclick="deletePdfFile(event, '${file.id}')">✕ Sil</button>
        `;
        card.onclick = () => openPdfReader(file.id);
        grid.appendChild(card);
      });

      if (subFolders.length === 0 && files.length === 0) {
        grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:50px; color:#888; font-size:16px;">Bu klasör boş. Sağ alttaki (+) butonuyla PDF ekleyebilirsiniz.</div>';
      }
    }

    function openAddMenuModal() { document.getElementById('addMenuModal').classList.add('active'); }
    function closeAddMenuModal() { document.getElementById('addMenuModal').classList.remove('active'); }
    function triggerPdfUpload() { closeAddMenuModal(); document.getElementById('hiddenPdfPicker').click(); }

    function handlePdfSelected(event) {
      const file = event.target.files[0];
      if (!file) return;
      const title = prompt('Eser veya makale başlığı:', file.name.replace('.pdf', '')) || file.name;
      const reader = new FileReader();
      reader.onload = function(e) {
        const newDoc = {
          id: Date.now().toString(),
          folderId: currentFolderId,
          title: title,
          data: e.target.result,
          lastPage: 1,
          progress: 0,
          yellowPages: [],
          blueItems: [],
          redItems: [],
          highlights: {} // sayfa bazlı highlight verileri
        };
        storedFiles.unshift(newDoc);
        localStorage.setItem('emir_os_files', JSON.stringify(storedFiles));
        renderBrowserView();
        openPdfReader(newDoc.id);
      };
      reader.readAsDataURL(file);
      event.target.value = '';
    }

    function promptNewFolder() {
      closeAddMenuModal();
      const name = prompt('Yeni Klasör Adı:');
      if (!name || !name.trim()) return;
      storedFolders.push({
        id: 'folder_' + Date.now(),
        parent: currentFolderId,
        name: name.trim(),
        isArticleFolder: name.toLowerCase().includes('makale')
      });
      localStorage.setItem('emir_os_folders', JSON.stringify(storedFolders));
      renderBrowserView();
    }

    function deletePdfFile(e, id) {
      e.stopPropagation();
      if (!confirm('Bu PDF silinsin mi?')) return;
      storedFiles = storedFiles.filter(x => x.id !== id);
      localStorage.setItem('emir_os_files', JSON.stringify(storedFiles));
      renderBrowserView();
    }

    // ==========================================
    // ADOBE / EDGE TARZI AKILLI HIGHLIGHT MOTORU
    // ==========================================
    let currentActivePdf = null;
    let pdfDoc = null;
    let currentPdfPage = 1;

    const rCanvas = document.getElementById('pdfRenderCanvas');
    const rCtx = rCanvas.getContext('2d');
    const dCanvas = document.getElementById('pdfDrawCanvas');
    const dCtx = dCanvas.getContext('2d');

    let isHighlighterActive = true;
    let isHighlightSelecting = false;
    let pdfToolMode = 'yellow'; // 'yellow' | 'blue' | 'red' | 'eraser'
    let pageTextItems = []; // Kelime koordinat kutuları

    let dragStartPos = null;
    let currentDragPos = null;

    function openPdfReader(fileId) {
      currentActivePdf = storedFiles.find(x => x.id === fileId);
      if (!currentActivePdf) return;
      if (!currentActivePdf.highlights) currentActivePdf.highlights = {};
      if (!currentActivePdf.yellowPages) currentActivePdf.yellowPages = [];
      if (!currentActivePdf.blueItems) currentActivePdf.blueItems = [];
      if (!currentActivePdf.redItems) currentActivePdf.redItems = [];

      document.getElementById('pdfReaderModal').classList.add('active');
      currentPdfPage = currentActivePdf.lastPage || 1;

      pdfjsLib.getDocument(currentActivePdf.data).promise.then(pdf => {
        pdfDoc = pdf;
        const slider = document.getElementById('pageScrubberSlider');
        slider.max = pdf.numPages;
        slider.value = currentPdfPage;
        renderReaderPage(currentPdfPage);
      }).catch(err => {
        alert('PDF açılamadı.');
      });
    }

    function closePdfReader() {
      document.getElementById('pdfReaderModal').classList.remove('active');
      renderBrowserView();
    }

    function renderReaderPage(num) {
      pdfDoc.getPage(num).then(page => {
        const viewport = page.getViewport({ scale: 1.35 });
        rCanvas.height = viewport.height;
        rCanvas.width = viewport.width;
        dCanvas.height = viewport.height;
        dCanvas.width = viewport.width;

        page.render({ canvasContext: rCtx, viewport: viewport }).promise.then(() => {
          // Sayfadaki metinlerin koordinatlarını PDF motorundan çek
          page.getTextContent().then(textContent => {
            extractPageTextCoordinates(textContent, viewport);
            redrawSavedHighlights(num);
          });
        });
      });
      document.getElementById('pdfPageInfo').textContent = `${num} / ${pdfDoc.numPages}`;
      document.getElementById('pageScrubberSlider').value = num;
    }

    // Kelimelerin Bounding Box (Kutu) haritasını çıkar
    function extractPageTextCoordinates(textContent, viewport) {
      pageTextItems = [];
      textContent.items.forEach(item => {
        const tx = pdfjsLib.Util.transform(viewport.transform, item.transform);
        const fontHeight = Math.sqrt((tx[2] * tx[2]) + (tx[3] * tx[3]));
        const width = item.width * (viewport.scale || 1.35);
        const x = tx[4];
        const y = tx[5] - fontHeight;

        // Kelimeleri bölerek kaydet
        const words = item.str.split(/\s+/);
        let currX = x;
        const avgCharWidth = width / (item.str.length || 1);

        words.forEach(w => {
          if (!w) return;
          const wWidth = w.length * avgCharWidth;
          pageTextItems.push({
            text: w,
            rect: { x: currX, y: y, w: wWidth, h: fontHeight }
          });
          currX += wWidth + avgCharWidth;
        });
      });
    }

    function onScrubberSlide(val) {
      const pageIndex = parseInt(val, 10);
      if (pageIndex !== currentPdfPage && pageIndex >= 1 && pageIndex <= pdfDoc.numPages) {
        currentPdfPage = pageIndex;
        renderReaderPage(currentPdfPage);
      }
    }
    function pdfPrevPage() { if (currentPdfPage > 1) { currentPdfPage--; renderReaderPage(currentPdfPage); } }
    function pdfNextPage() { if (currentPdfPage < pdfDoc.numPages) { currentPdfPage++; renderReaderPage(currentPdfPage); } }

    function toggleHighlighterMode() {
      isHighlighterActive = !isHighlighterActive;
      const btn = document.getElementById('hlToggleBtn');
      if (isHighlighterActive) {
        btn.classList.add('active');
        btn.innerHTML = '<span>🖍️ Vurgulayıcı: AÇIK</span>';
        dCanvas.classList.add('drawing-enabled');
      } else {
        btn.classList.remove('active');
        btn.innerHTML = '<span>🖐️ Okuma Modu</span>';
        dCanvas.classList.remove('drawing-enabled');
      }
    }

    function setPdfColor(mode) {
      pdfToolMode = mode;
      document.querySelectorAll('.color-legend-badge').forEach(b => b.classList.remove('active'));
      if (mode === 'yellow') document.getElementById('badgeYellow').classList.add('active');
      else if (mode === 'blue') document.getElementById('badgeBlue').classList.add('active');
      else if (mode === 'red') document.getElementById('badgeRed').classList.add('active');
    }
    function setPdfEraser() {
      pdfToolMode = 'eraser';
      document.querySelectorAll('.color-legend-badge').forEach(b => b.classList.remove('active'));
    }

    function getCoords(e) {
      const r = dCanvas.getBoundingClientRect();
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: cx - r.left, y: cy - r.top };
    }

    // POINTER İLE ÇEKİLEN YERE KADAR AKILLI SNAP SEÇİMİ
    dCanvas.addEventListener('pointerdown', e => {
      if (!isHighlighterActive) return;
      isHighlightSelecting = true;
      dragStartPos = getCoords(e);
      currentDragPos = dragStartPos;
    });

    dCanvas.addEventListener('pointermove', e => {
      if (!isHighlightSelecting || !isHighlighterActive) return;
      e.preventDefault();
      currentDragPos = getCoords(e);
      renderSelectionPreview();
    });

    window.addEventListener('pointerup', () => {
      if (isHighlightSelecting) {
        isHighlightSelecting = false;
        finalizeHighlightSelection();
      }
    });

    function getSelectionBoundingBox() {
      if (!dragStartPos || !currentDragPos) return null;
      const minX = Math.min(dragStartPos.x, currentDragPos.x);
      const maxX = Math.max(dragStartPos.x, currentDragPos.x);
      const minY = Math.min(dragStartPos.y, currentDragPos.y);
      const maxY = Math.max(dragStartPos.y, currentDragPos.y);
      return { x: minX, y: minY, w: maxX - minX, h: Math.max(22, maxY - minY) };
    }

    // Seçim esnasında hafif kılavuz göster
    function renderSelectionPreview() {
      redrawSavedHighlights(currentPdfPage);
      const sel = getSelectionBoundingBox();
      if (!sel) return;
      dCtx.fillStyle = 'rgba(197, 155, 76, 0.2)';
      dCtx.fillRect(sel.x, sel.y, sel.w, sel.h);
    }

    // Kalem bırakılınca kelimelere tam oturan highlight kutularını çiz ve kaydet
    function finalizeHighlightSelection() {
      const sel = getSelectionBoundingBox();
      if (!sel || (sel.w < 5 && sel.h < 5)) {
        redrawSavedHighlights(currentPdfPage);
        return;
      }

      if (pdfToolMode === 'eraser') {
        // Silgi: Seçilen kutudaki highlight'ları kaldır
        if (currentActivePdf && currentActivePdf.highlights[currentPdfPage]) {
          currentActivePdf.highlights[currentPdfPage] = currentActivePdf.highlights[currentPdfPage].filter(h => {
            return !(h.rect.x < sel.x + sel.w && h.rect.x + h.rect.w > sel.x &&
                     h.rect.y < sel.y + sel.h && h.rect.y + h.rect.h > sel.y);
          });
          recalcReadingProgress();
          redrawSavedHighlights(currentPdfPage);
        }
        return;
      }

      // Kalemin çektiği alanla kesişen tüm kelimeleri yakala
      const matched = pageTextItems.filter(item => {
        const r = item.rect;
        return (r.x < sel.x + sel.w && r.x + r.w > sel.x &&
                r.y < sel.y + sel.h && r.y + r.h > sel.y);
      });

      if (matched.length === 0) {
        // Eğer OCR metin kutusu yoksa bile kullanıcının çektiği koordinatı doğrudan snap bloğu yap
        matched.push({ text: 'Metin Bloğu', rect: sel });
      }

      if (!currentActivePdf.highlights[currentPdfPage]) {
        currentActivePdf.highlights[currentPdfPage] = [];
      }

      const colorMap = {
        yellow: 'rgba(255, 225, 53, 0.50)',
        blue: 'rgba(56, 148, 255, 0.45)',
        red: 'rgba(255, 71, 87, 0.45)'
      };

      const selectedWords = matched.map(m => m.text).join(' ');

      matched.forEach(m => {
        currentActivePdf.highlights[currentPdfPage].push({
          rect: m.rect,
          color: colorMap[pdfToolMode] || colorMap.yellow,
          mode: pdfToolMode
        });
      });

      // SARI İSE OKUNMA DURUMUNU GÜNCELLE
      if (pdfToolMode === 'yellow') {
        if (!currentActivePdf.yellowPages.includes(currentPdfPage)) {
          currentActivePdf.yellowPages.push(currentPdfPage);
        }
        recalcReadingProgress();
      }

      // MAVİ İSE KELİME HAVUZUNA EKLE
      if (pdfToolMode === 'blue') {
        currentActivePdf.blueItems.push({ page: currentPdfPage, text: selectedWords });
      }

      // KIRMIZI İSE KAVRAM/ÖZET HAVUZUNA EKLE
      if (pdfToolMode === 'red') {
        currentActivePdf.redItems.push({ page: currentPdfPage, text: selectedWords });
      }

      // ÇİZER ÇİZMEZ ANINDA OTOMATİK SENTEZİ NOTLAR'A GÖNDER!
      autoSynthesizeAndPushNotes();

      localStorage.setItem('emir_os_files', JSON.stringify(storedFiles));
      redrawSavedHighlights(currentPdfPage);
    }

    // Kayıtlı highlight'ları tam kelime sınırlarıyla ekrana bas
    function redrawSavedHighlights(pageNum) {
      dCtx.clearRect(0, 0, dCanvas.width, dCanvas.height);
      if (!currentActivePdf || !currentActivePdf.highlights || !currentActivePdf.highlights[pageNum]) return;

      currentActivePdf.highlights[pageNum].forEach(hl => {
        dCtx.fillStyle = hl.color;
        // Metnin üzerine tam oturan yuvarlatılmış fosforlu dikdörtgen
        dCtx.beginPath();
        const r = hl.rect;
        dCtx.roundRect ? dCtx.roundRect(r.x, r.y - 1, r.w, r.h + 2, 4) : dCtx.rect(r.x, r.y - 1, r.w, r.h + 2);
        dCtx.fill();
      });
    }

    function recalcReadingProgress() {
      if (!currentActivePdf || !pdfDoc) return;
      const yellowCount = (currentActivePdf.yellowPages || []).length;
      const total = pdfDoc.numPages || 1;
      const pct = Math.min(100, Math.round((yellowCount / total) * 100));
      currentActivePdf.progress = pct;
      localStorage.setItem('emir_os_files', JSON.stringify(storedFiles));
    }

    // ÇİZER ÇİZMEZ ANINDA ÇALIŞAN OTOMATİK SENTEZ MOTORU
    function autoSynthesizeAndPushNotes() {
      if (!currentActivePdf) return;
      let notes = JSON.parse(localStorage.getItem('emir_os_notes_pages') || '[]');
      
      const blueList = currentActivePdf.blueItems || [];
      const redList = currentActivePdf.redItems || [];
      const progress = currentActivePdf.progress || 0;

      // Bu makaleye ait mevcut notu bul veya başa ekle
      const noteTitle = currentActivePdf.title;
      notes = notes.filter(n => !n.includes(`data-doc-id="${currentActivePdf.id}"`));

      const newBlock = `
        <div data-doc-id="${currentActivePdf.id}">
          <div style="border-bottom:2px solid var(--gold); padding-bottom:8px; display:flex; justify-content:space-between; align-items:flex-end;">
            <div style="font-size:22px; font-weight:800; color:var(--navy);">${currentActivePdf.title}</div>
            <div style="font-size:12px; color:var(--muted); font-weight:700;">%${progress} okundu · s.${currentPdfPage}</div>
          </div>
          <div style="margin-top:16px;">
            <div style="font-weight:700; color:var(--red); font-size:15px; margin-bottom:8px;">🔴 Taranan Akademik Kavramlar & Tezler:</div>
            <div style="background:#fff; border:1.5px solid var(--border); border-left:5px solid var(--red); padding:14px; border-radius:12px; font-family:monospace; font-size:13px; line-height:24px;">
[${currentActivePdf.title}]
${redList.length > 0 ? redList.map(r => `  ├── (s.${r.page}) "${r.text}"`).join('\n') : '  └── Henüz kırmızı kavram işaretlenmedi.'}
            </div>

            <div style="font-weight:700; color:var(--blue); font-size:15px; margin-top:18px; margin-bottom:8px;">🔵 Taranan Bilinmeyen Kelimeler (Sözlük):</div>
            <div style="display:flex; flex-direction:column; gap:8px;">
              ${blueList.length > 0 ? blueList.map(b => `
                <div style="background:#fff; border:1px solid var(--border); border-left:4px solid var(--blue); padding:10px 14px; border-radius:10px; font-size:13px;">
                  <strong>(s.${b.page}) "${b.text}":</strong> Academic expression in context.
                </div>
              `).join('') : '<span style="font-size:13px; color:#777;">Henüz mavi kelime işaretlenmedi.</span>'}
            </div>
          </div>
        </div>
      `;

      notes.unshift(newBlock);
      localStorage.setItem('emir_os_notes_pages', JSON.stringify(notes));
    }

    // ==========================================
    // NOTLAR DEFTERİ
    // ==========================================
    let currentNotesIdx = 0;

    function renderNotesPage() {
      const container = document.getElementById('notesPageContent');
      const label = document.getElementById('notesPageIndex');
      const notesPages = JSON.parse(localStorage.getItem('emir_os_notes_pages') || '[]');

      if (notesPages.length === 0) {
        label.textContent = 'Sayfa: 0 / 0';
        container.innerHTML = '<p style="font-style:italic; color:#777; margin-top:20px;">Henüz okuma yapılmadı. Kütüphanede bir PDF okurken kırmızı veya maviyle işaretlediğiniz an sentezler otomatik buraya eklenecektir.</p>';
        return;
      }

      if (currentNotesIdx >= notesPages.length) currentNotesIdx = notesPages.length - 1;
      label.textContent = `Sayfa: ${currentNotesIdx + 1} / ${notesPages.length}`;
      container.innerHTML = notesPages[currentNotesIdx];
    }
    function nextNotesPage() {
      const notesPages = JSON.parse(localStorage.getItem('emir_os_notes_pages') || '[]');
      if (currentNotesIdx < notesPages.length - 1) { currentNotesIdx++; renderNotesPage(); }
    }
    function prevNotesPage() {
      if (currentNotesIdx > 0) { currentNotesIdx--; renderNotesPage(); }
    }

    // ==========================================
    // KİŞİSEL DEFTER
    // ==========================================
    let personalSheets = JSON.parse(localStorage.getItem('emir_os_personal_sheets') || '[""]');
    let sheetIdx = 0;
    const pCanvas = document.getElementById('personalCanvas');
    const pCtx = pCanvas.getContext('2d');
    let isDrawingPersonal = false;
    let isPersonalEraserActive = false;
    let currentColor = '#132136';
    let currentPenWidth = 3;

    function initPersonalCanvas() {
      const wrap = document.getElementById('personalPadWrap');
      if (pCanvas.width !== wrap.clientWidth || pCanvas.height !== wrap.clientHeight) {
        pCanvas.width = wrap.clientWidth;
        pCanvas.height = wrap.clientHeight;
        loadCurrentSheet();
      }
    }

    function loadCurrentSheet() {
      pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
      pCtx.globalCompositeOperation = 'source-over';
      const data = personalSheets[sheetIdx];
      if (data && data.length > 10) {
        const img = new Image();
        img.onload = () => pCtx.drawImage(img, 0, 0);
        img.src = data;
      }
      document.getElementById('personalSheetIndex').textContent = `Sayfa: ${sheetIdx + 1} / ${personalSheets.length}`;
    }

    function saveCurrentSheet() {
      personalSheets[sheetIdx] = pCanvas.toDataURL();
      localStorage.setItem('emir_os_personal_sheets', JSON.stringify(personalSheets));
    }

    function selectPenColor(col, el) {
      isPersonalEraserActive = false;
      pCtx.globalCompositeOperation = 'source-over';
      currentColor = col;
      document.getElementById('eraserToggleBtn').style.background = '#ece6d8';
      document.getElementById('eraserToggleBtn').style.color = '#132136';
      document.querySelectorAll('.palette-circle').forEach(c => c.classList.remove('active'));
      if (el) el.classList.add('active');
      updateSizeDisplay();
    }

    function toggleEraser(el) {
      isPersonalEraserActive = true;
      pCtx.globalCompositeOperation = 'destination-out';
      document.querySelectorAll('.palette-circle').forEach(c => c.classList.remove('active'));
      el.style.background = '#132136';
      el.style.color = '#ffffff';
      updateSizeDisplay();
    }

    function onBrushSizeChange(val) {
      currentPenWidth = parseInt(val, 10);
      updateSizeDisplay();
    }

    function updateSizeDisplay() {
      const label = document.getElementById('brushSizeLabel');
      const dot = document.getElementById('sizePreviewDot');
      label.textContent = isPersonalEraserActive ? `Silgi: ${currentPenWidth * 1.5}px` : `Kalınlık: ${currentPenWidth}px`;
      dot.style.width = Math.min(26, Math.max(6, currentPenWidth)) + 'px';
      dot.style.height = dot.style.width;
      dot.style.background = isPersonalEraserActive ? '#dc2626' : (currentColor.includes('rgba') ? '#f59e0b' : currentColor);
    }

    function getPersonalCoords(e) {
      const rect = pCanvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    pCanvas.addEventListener('pointerdown', e => {
      isDrawingPersonal = true;
      const pos = getPersonalCoords(e);
      pCtx.beginPath();
      pCtx.moveTo(pos.x, pos.y);
    });

    pCanvas.addEventListener('pointermove', e => {
      if (!isDrawingPersonal) return;
      e.preventDefault();
      const pos = getPersonalCoords(e);
      pCtx.lineTo(pos.x, pos.y);
      pCtx.strokeStyle = isPersonalEraserActive ? 'rgba(0,0,0,1)' : currentColor;
      pCtx.lineWidth = isPersonalEraserActive ? (currentPenWidth * 1.5) : currentPenWidth;
      pCtx.lineCap = 'round';
      pCtx.lineJoin = 'round';
      pCtx.stroke();
    });

    window.addEventListener('pointerup', () => {
      if (isDrawingPersonal) {
        isDrawingPersonal = false;
        saveCurrentSheet();
      }
    });

    function nextPersonalSheet() {
      saveCurrentSheet();
      if (sheetIdx < personalSheets.length - 1) { sheetIdx++; loadCurrentSheet(); }
    }
    function prevPersonalSheet() {
      saveCurrentSheet();
      if (sheetIdx > 0) { sheetIdx--; loadCurrentSheet(); }
    }
    function addPersonalSheet() {
      saveCurrentSheet();
      personalSheets.push("");
      sheetIdx = personalSheets.length - 1;
      loadCurrentSheet();
    }
    function clearPersonalPad() {
      pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
      saveCurrentSheet();
    }
  </script>
</body>
</html>
