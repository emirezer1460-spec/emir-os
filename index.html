<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>EMIR OS</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#132136">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #f5f1e8;
      --card: #ffffff;
      --navy: #132136;
      --navy-light: #213554;
      --gold: #c59b4c;
      --border: #e2dbcd;
      --text: #1a202c;
      --muted: #64748b;
      --shadow-app: 0 16px 36px rgba(19, 33, 54, 0.16);
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .os-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ÜST BAR */
    .os-topbar {
      height: 68px;
      background: var(--navy);
      color: #fff;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 50;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      position: relative;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .center-logo-wrap {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }
    .eo-circle-logo {
      width: 44px;
      height: 44px;
      background: radial-gradient(circle, #213554 0%, #0a1322 100%);
      border: 2px solid var(--gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(197, 155, 76, 0.35);
    }
    .eo-svg { width: 26px; height: 26px; }
    .os-title-text {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #fbf7ee;
    }

    /* 1. ANA EKRAN */
    #home-launcher {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 32px;
      width: 100%;
      height: calc(100vh - 68px);
    }
    .tri-app-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
      width: 100%;
      max-width: 1200px;
      height: 72vh;
      align-items: stretch;
    }
    @media (max-width: 850px) {
      .tri-app-grid { grid-template-columns: 1fr; height: auto; overflow-y: auto; }
    }
    .giant-app-card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      cursor: pointer;
      box-shadow: var(--shadow-app);
      transition: transform 0.15s ease, border-color 0.15s ease;
      position: relative;
      overflow: hidden;
      user-select: none;
    }
    .giant-app-card:active { transform: scale(0.95); border-color: var(--gold); }
    .giant-app-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; height: 8px;
      background: var(--gold);
    }
    .giant-icon-bubble {
      width: 130px;
      height: 130px;
      border-radius: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.08);
      border: 3px solid rgba(255,255,255,0.9);
      pointer-events: none;
    }
    .giant-label-text {
      font-size: 24px;
      font-weight: 800;
      color: var(--navy);
      letter-spacing: 0.5px;
      pointer-events: none;
    }

    /* 2. TAM EKRAN MODÜLLER */
    .fullscreen-app-view {
      position: absolute;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: var(--bg);
      display: none;
      flex-direction: column;
      z-index: 100;
      overflow: hidden;
    }
    .fullscreen-app-view.active { display: flex !important; }

    .app-topbar {
      height: 64px;
      padding: 0 24px;
      background: var(--navy);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      gap: 12px;
    }
    .home-circle-btn {
      width: 44px;
      height: 44px;
      background: radial-gradient(circle, #213554 0%, #0e1929 100%);
      border: 1.5px solid var(--gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: transform 0.15s ease;
      flex-shrink: 0;
    }
    .home-circle-btn:active { transform: scale(0.9); }
    .home-circle-btn svg { width: 22px; height: 22px; }

    /* HIZLI SAYFA ATLAYICI SCRUBBER */
    .page-scrubber-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.08);
      padding: 4px 12px;
      border-radius: 12px;
    }
    .page-scrubber-box input[type="range"] {
      width: 120px;
      accent-color: var(--gold);
      cursor: pointer;
    }

    /* KÜTÜPHANE */
    .lib-browser-stage {
      flex: 1;
      padding: 24px 32px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .lib-nav-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .lib-breadcrumb-bar {
      font-size: 16px;
      font-weight: 700;
      color: var(--navy);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .folder-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 20px;
    }
    .big-folder-card {
      background: #ffffff;
      border: 2px solid var(--border);
      border-radius: 24px;
      padding: 22px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,0.05);
      transition: transform 0.15s ease, border-color 0.15s ease;
      user-select: none;
      position: relative;
    }
    .big-folder-card:active { transform: scale(0.94); border-color: var(--gold); }
    .big-folder-icon { font-size: 52px; pointer-events: none; }
    .big-folder-name { font-size: 15px; font-weight: 800; color: var(--navy); text-align: center; pointer-events: none; }

    .reading-progress-wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-top: 6px;
      pointer-events: none;
    }
    .reading-progress-bar-bg {
      width: 100%;
      height: 8px;
      background: #e2dbcd;
      border-radius: 6px;
      overflow: hidden;
    }
    .reading-progress-bar-fill {
      height: 100%;
      border-radius: 6px;
      transition: width 0.3s ease, background-color 0.3s ease;
    }
    .reading-progress-text {
      font-size: 12px;
      font-weight: 800;
      text-align: right;
      transition: color 0.3s ease;
    }

    .fab-add-btn {
      position: absolute;
      bottom: 32px;
      right: 32px;
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: var(--gold);
      color: #fff;
      font-size: 38px;
      font-weight: 300;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(197, 155, 76, 0.45);
      cursor: pointer;
      z-index: 40;
    }
    .fab-add-btn:active { transform: scale(0.9); }
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: #fff;
      border-radius: 24px;
      padding: 28px;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 20px 45px rgba(0,0,0,0.25);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* TEK BİRLEŞİK NOTLAR DEFTERİ */
    .unified-notebook-stage {
      flex: 1;
      padding: 32px 24px;
      overflow-y: auto;
      display: flex;
      justify-content: center;
    }
    .unified-notebook-paper {
      width: 100%;
      max-width: 920px;
      background: #fbf9f4;
      background-image: linear-gradient(#e6dfd1 1px, transparent 1px);
      background-size: 100% 32px;
      line-height: 32px;
      border: 3px solid var(--border);
      border-radius: 24px;
      padding: 40px 48px;
      box-shadow: 0 16px 40px rgba(19, 33, 54, 0.12);
      font-family: "Georgia", serif;
      min-height: 85vh;
    }
    .vocab-card-box {
      background: #fff;
      border: 1.5px solid var(--border);
      border-left: 5px solid var(--navy-light);
      padding: 12px
